name: Windows routing validation

on:
  push:
    branches: [codex/windows-routing-validation]
  workflow_dispatch:
    inputs:
      windows_run_id:
        description: 'Run containing the Windows release package'
        type: string
        required: false
      source_ref:
        description: 'Git commit or tag to test'
        type: string
        required: false
  workflow_call:
    inputs:
      windows_run_id:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  wfp:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        if: inputs.windows_run_id != ''
        with:
          name: windows
          path: artifacts/wfp-package
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
      - name: Stage sing-box for the core crash test
        shell: pwsh
        env:
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINDOWS_RUN_ID) {
            $zip = 'artifacts/wfp-package/BebekonVPN-Portable-x64.zip'
            $entry = 'core/sing-box.exe'
          } else {
            $pin = Get-Content core/version.json -Raw | ConvertFrom-Json
            $zip = Join-Path $env:RUNNER_TEMP $pin.archive
            Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$($pin.version)/$($pin.archive)" -OutFile $zip
            if ((Get-FileHash $zip).Hash -ne $pin.sha256) { throw 'sing-box archive checksum mismatch.' }
            $entry = "sing-box-$($pin.version)-windows-amd64/sing-box.exe"
          }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $core = @($archive.Entries | Where-Object { $_.FullName.Replace('\','/') -eq $entry })
            if ($core.Count -ne 1) { throw 'Expected one sing-box executable in the package.' }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($core[0], (Join-Path $PWD 'core/sing-box.exe'), $true)
          } finally { $archive.Dispose() }
      - name: Verify WFP in the disposable Windows runner
        shell: pwsh
        env:
          BEBEKON_WFP_TEST_VM: '1'
        run: |
          netsh wfp set options netevents=on
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Bebekon.Tests/Bebekon.Tests.csproj -c Release -p:WfpKernelOnly=true --filter 'Category=WfpKernel' --logger 'trx;LogFileName=wfp.trx' --results-directory artifacts/wfp
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0 -and (Test-Path -LiteralPath artifacts/wfp/wfp.trx)) {
            $trx = [xml](Get-Content -LiteralPath artifacts/wfp/wfp.trx -Raw)
            $trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed' | ForEach-Object {
              $message = ([string]$_.Output.ErrorInfo.Message).Replace('%', '%25').Replace([string][char]13, '%0D').Replace([string][char]10, '%0A')
              Write-Output "::error::$message"
            }
          }
          exit $testExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wfp-results
          path: artifacts/wfp/*.trx
          if-no-files-found: ignore
